<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Up — AI Assistant</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Epilogue:wght@300;400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#0A0814;--deep:#110E22;--card:#16132E;--card2:#1C1938;
  --border:rgba(139,92,246,0.18);--border2:rgba(139,92,246,0.35);
  --text:#EDE8FF;--muted:#8B82B8;--soft:#4A4670;
  --neon:#8B5CF6;--neon2:#7C3AED;--pink:#EC4899;
  --cyan:#06B6D4;--green:#10B981;--gold:#F59E0B;
  --pulse: rgba(139,92,246,0.15);
}

html,body{height:100%;font-family:'Epilogue',sans-serif;background:var(--void);color:var(--text);overflow:hidden}

/* ── BACKGROUND ── */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.4;animation:drift 8s ease-in-out infinite}
.orb1{width:400px;height:400px;background:radial-gradient(circle,rgba(139,92,246,0.3),transparent 70%);top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(236,72,153,0.2),transparent 70%);bottom:-80px;right:-80px;animation-delay:-3s}
.orb3{width:200px;height:200px;background:radial-gradient(circle,rgba(6,182,212,0.15),transparent 70%);top:40%;left:30%;animation-delay:-5s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}

/* ── LAYOUT ── */
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}

/* ── HEADER ── */
.header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(10,8,20,0.8);backdrop-filter:blur(16px);flex-shrink:0}
.header-left{display:flex;align-items:center;gap:10px}
.ai-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--pink));display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;flex-shrink:0}
.ai-avatar::after{content:'';position:absolute;bottom:1px;right:1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--void);animation:onlinePulse 2s infinite}
@keyframes onlinePulse{0%,100%{opacity:1}50%{opacity:0.5}}
.ai-name{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:var(--text)}
.ai-status{font-size:10px;color:var(--green);font-weight:500;margin-top:1px}
.header-right{display:flex;gap:8px}
.hbtn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:'Epilogue',sans-serif;transition:all .2s}
.hbtn:hover{border-color:var(--neon);color:var(--neon)}
.ip-badge{display:flex;align-items:center;gap:5px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:20px;padding:4px 10px;font-size:10px;font-weight:500;color:var(--green)}
.ip-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:onlinePulse 2s infinite}

/* ── CHAT AREA ── */
.chat-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.chat-wrap::-webkit-scrollbar{width:3px}
.chat-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Messages */
.msg{display:flex;gap:8px;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-ava{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px}
.msg-ava.ai{background:linear-gradient(135deg,var(--neon),var(--pink))}
.msg-ava.user{background:rgba(139,92,246,0.2);color:var(--neon);font-family:'Syne',sans-serif}
.bubble{max-width:82%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.65}
.bubble.ai{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.bubble.user{background:linear-gradient(135deg,var(--neon2),#6D28D9);color:#fff;border-bottom-right-radius:4px}
.bubble p{margin-bottom:6px}
.bubble p:last-child{margin:0}
.bubble strong{color:#fff;font-weight:600}
.bubble.ai strong{color:var(--text)}
.ts{font-size:10px;color:var(--soft);margin-top:3px}
.ts.right{text-align:right}

/* Typing indicator */
.typing-wrap{display:flex;gap:8px;align-items:center}
.typing-bubble{background:var(--card);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px;padding:12px 16px;display:flex;gap:4px;align-items:center}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typingBounce 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* Quick reply chips */
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 4px 36px}
.qr-chip{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);color:var(--neon);background:rgba(139,92,246,0.06);transition:all .18s;font-family:'Epilogue',sans-serif}
.qr-chip:hover{background:rgba(139,92,246,0.15);border-color:var(--neon)}

/* Cards inside chat */
.chat-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:6px}
.chat-card-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text)}
.cc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.cc-row:last-child{border:none;padding-bottom:0}
.cc-key{color:var(--muted)}.cc-val{color:var(--text);font-weight:500}
.feature-list{display:flex;flex-direction:column;gap:6px}
.feat-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted);line-height:1.5}
.feat-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px;background:var(--neon)}
.plan-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.plan-chip{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600}
.pc-free{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2)}
.pc-pro{background:rgba(139,92,246,0.12);color:var(--neon);border:1px solid var(--border2)}
.pc-elite{background:rgba(236,72,153,0.1);color:var(--pink);border:1px solid rgba(236,72,153,0.2)}
.glow-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--gold)}

/* Registration form inside chat */
.reg-form{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:6px}
.rf-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)}
.rf-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.rf-field label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.rf-field input,.rf-field select{background:var(--deep);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:12px;font-family:'Epilogue',sans-serif;outline:none;transition:border-color .18s}
.rf-field input:focus,.rf-field select:focus{border-color:var(--neon)}
.rf-field select option{background:var(--deep)}
.rf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rf-submit{width:100%;padding:11px;background:linear-gradient(135deg,var(--neon2),#6D28D9);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Epilogue',sans-serif;margin-top:4px;transition:opacity .2s}
.rf-submit:hover{opacity:.88}
.social-login-row{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.soc-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);font-family:'Epilogue',sans-serif;transition:all .18s}
.soc-btn:hover{border-color:var(--neon);color:var(--text)}
.divider-or{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--soft);margin:8px 0}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--border)}

/* Progress bar in reg */
.reg-progress{display:flex;gap:4px;margin-bottom:14px}
.rp-dot{flex:1;height:3px;border-radius:2px;background:var(--border)}
.rp-dot.filled{background:linear-gradient(90deg,var(--neon),var(--pink))}

/* ── INPUT AREA ── */
.input-area{padding:12px 16px;border-top:1px solid var(--border);background:rgba(10,8,20,0.9);backdrop-filter:blur(16px);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 14px;font-size:13px;font-family:'Epilogue',sans-serif;outline:none;resize:none;max-height:100px;transition:border-color .18s;line-height:1.5}
.chat-input:focus{border-color:var(--neon)}
.chat-input::placeholder{color:var(--soft)}
.send-btn{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--neon),var(--pink));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s}
.send-btn:hover{opacity:.88}
.send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.input-hint{font-size:10px;color:var(--soft);text-align:center;margin-top:6px}

/* New visitor banner */
.visitor-banner{background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(236,72,153,0.08));border:1px solid var(--border2);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.vb-icon{font-size:18px;flex-shrink:0}
.vb-text strong{color:var(--text);font-weight:600;display:block;margin-bottom:2px}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="ai-avatar">✦</div>
      <div>
        <div class="ai-name">Glow AI</div>
        <div class="ai-status">Online · Here to assist you</div>
      </div>
    </div>
    <div class="header-right">
      <div class="ip-badge" id="ipBadge"><span class="ip-dot"></span><span id="ipText">Detecting...</span></div>
      <button class="hbtn" onclick="resetChat()">Start new chat</button>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-wrap" id="chatWrap"></div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-row">
      <textarea class="chat-input" id="chatInput" placeholder="How may I assist you today?" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendUserMsg()" aria-label="Send message">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="input-hint">Powered by Glow Up AI · Your privacy is fully protected</div>
  </div>

</div>

<script>
const BOT_NAME = 'Glow AI';
const USER_INITIALS = 'You';
let regStep = 0;
let regData = {};
let isTyping = false;
let visitorIP = null;
let isNewVisitor = true;
let conversationState = 'greeting'; // greeting | info | register | registered

// ── IP DETECTION & AUTO GREET ──
async function detectIP() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    visitorIP = data.ip;
    document.getElementById('ipText').textContent = visitorIP;
    checkNewVisitor(visitorIP);
  } catch {
    visitorIP = 'Unknown';
    document.getElementById('ipText').textContent = 'New visitor';
    startGreeting(true);
  }
}

function checkNewVisitor(ip) {
  const seen = localStorage.getItem('gu_seen_' + ip);
  isNewVisitor = !seen;
  if (isNewVisitor) {
    localStorage.setItem('gu_seen_' + ip, Date.now());
  }
  startGreeting(isNewVisitor);
}

function startGreeting(isNew) {
  setTimeout(() => {
    if (isNew) {
      showNewVisitorBanner();
      setTimeout(() => typeMessage(getGreetingMsg(true), getGreetingReplies()), 800);
    } else {
      setTimeout(() => typeMessage(getGreetingMsg(false), getGreetingReplies()), 400);
    }
  }, 600);
}

function getGreetingMsg(isNew) {
  if (isNew) {
    return `Good day, and a warm welcome to <strong>Glow Up</strong>! 👋 I'm <strong>Glow AI</strong>, your dedicated platform assistant.\n\nIt's wonderful to have you here. I'd be delighted to walk you through everything — what Glow Up offers, how it works, and how to get your account set up in just a few minutes.\n\nHow may I assist you today?`;
  }
  return `Welcome back to <strong>Glow Up</strong>! 🌟 It's a pleasure to see you again. I'm <strong>Glow AI</strong> — how may I assist you today?`;
}

function getGreetingReplies() {
  return [
    "What is Glow Up?",
    "I'm a creator — tell me more",
    "I'm a brand — tell me more",
    "Register me now",
    "How does earning work?"
  ];
}

function showNewVisitorBanner() {
  const wrap = document.getElementById('chatWrap');
  const banner = document.createElement('div');
  banner.className = 'visitor-banner';
  banner.innerHTML = `<div class="vb-icon">🔍</div><div class="vb-text"><strong>New visitor — welcome!</strong>It appears this is your first visit to Glow Up. I'd be happy to guide you through the platform and assist with your registration — it takes just 2 minutes.</div>`;
  wrap.appendChild(banner);
  wrap.scrollTop = wrap.scrollHeight;
}

// ── AI RESPONSES ──
const RESPONSES = {
  "what is glow up": {
    text: `Thank you for asking. <strong>Glow Up</strong> is a professional marketplace that seamlessly connects <strong>creators and influencers</strong> with <strong>brands and business operators</strong> for paid content partnerships.\n\nWe serve as a trusted intermediary — managing the matching process, digital contracts, secure payments, and analytics, so that you can focus entirely on what you do best.`,
    card: {
      title: "Glow Up at a glance",
      rows: [

        ["Commission", "8% from creator + 8% from brand"],

      ]
    },

  },
  "creator": {
    text: `We're delighted to have you consider joining as a <strong>creator on Glow Up</strong>. Here is a comprehensive overview of what the platform offers you:\n\n<strong>Your creator journey with Glow Up:</strong>`,
    features: [
      "Free signup — zero followers needed to start",
      "Build a professional portfolio with bio, media, rate card & niche tags",
      "Get matched with brands via AI-powered discovery",
      "Receive brand offers directly — accept or decline on your terms",
      "Calendar blocks your campaign dates automatically",
      "Track gross earnings, GLOW tokens & campaign history",
      "Grow through 4 tiers: Aspiring → Rising → Creator → Verified Pro",
      "Earn 250 GLOW tokens free on signup + 50 per connected social"
    ],
    replies: ["What are the creator plans?", "How much can I earn?", "Register as a creator", "Tell me about GLOW tokens"]
  },
  "brand": {
    text: `Thank you for your interest in partnering with us as a <strong>business or brand on Glow Up</strong>. Here is a full overview of the professional tools and services available to you:\n\n<strong>Your business toolkit on Glow Up:</strong>`,
    features: [
      "Search & filter verified creators by niche, tier, engagement rate",
      "Send campaign offers with full brief, deliverables & compensation",
      "Escrow-protected payments — funds held until deliverables approved",
      "Digital three-party contracts signed in-app",
      "Campaign calendar and deadline tracking",
      "Analytics dashboard with ROI reporting",

      "16% total commission — 8% from you + 8% from the creator"
    ],
    replies: ["Business plan pricing", "How does escrow work?", "Register as a business", "What is the 16% commission?"]
  },
  "earn": {
    text: `Excellent question. Here is a clear and transparent breakdown of how <strong>creators generate income</strong> through Glow Up:`,
    card: {
      title: "Creator earnings breakdown",
      rows: [
        ["Campaign fees", "Paid by brand — you negotiate the amount"],
        ["GLOW token bonuses", "Earned for activity, campaigns & referrals"],
        ["Referral rewards", "200 GLOW per friend who joins & completes profile"],
        ["Glow Up fee", "8% deducted from your deal value"],
        ["Example: $1,000 deal", "You receive $920 net"],
        ["Payout methods", "Bank, PayPal, Crypto or GLOW tokens"]
      ]
    },
    replies: ["What are the creator plans?", "Register as a creator", "Tell me about GLOW tokens"]
  },
  "glow": {
    text: `Certainly — the <strong>GLOW Token</strong> is Glow Up's native utility token, and it plays a central role in our platform economy. Here is everything you need to know:`,
    card: {
      title: "GLOW token economy",
      rows: [
        ["Ticker", "GLOW"],
        ["Starting price", "$0.10 per GLOW"],
        ["Signup bonus", "250 GLOW free"],

      ]
    },

  },

  },

    replies: ["See all plans", "Register now", "How does escrow work?"]
  },
  "escrow": {

    startReg: 'creator',
    replies: []
  },
  "register business": {
    text: `Excellent — I'd be happy to assist you in establishing your <strong>business account on Glow Up</strong>. 🏢\n\nI will guide you through each step of the registration process. Please complete the fields below at your convenience:`,
    startReg: 'business',
    replies: []
  },
  "register": {
    text: `Wonderful — we'd love to have you on board! Let's begin your registration with Glow Up. 🚀\n\nTo ensure we set up the most suitable account for you, could you please let us know whether you are joining as a <strong>creator/influencer</strong> or as a <strong>business/brand</strong>?`,
    replies: ["Register as a creator", "Register as a business"]
  }
};

function matchResponse(input) {
  const lower = input.toLowerCase().trim();
  if (lower.includes('what is') && lower.includes('glow up')) return 'what is glow up';
  if (lower.includes('creator') && (lower.includes('tell') || lower.includes('more') || lower.includes('influencer'))) return 'creator';
  if (lower.includes('brand') && (lower.includes('tell') || lower.includes('more') || lower.includes('business'))) return 'brand';
  if (lower.includes('earn') || lower.includes('money') || lower.includes('how much')) return 'earn';
  if (lower.includes('glow token') || lower.includes('glow coin') || lower.includes('token')) return 'glow';
  if (lower.includes('plan') || lower.includes('subscription') || lower.includes('pricing')) return 'plans';
  if (lower.includes('commission') || lower.includes('16%') || lower.includes('fee')) return 'commission';
  if (lower.includes('escrow') || lower.includes('payment protection')) return 'escrow';
  if ((lower.includes('register') || lower.includes('sign up') || lower.includes('join') || lower.includes('start')) && lower.includes('creator')) return 'register creator';
  if ((lower.includes('register') || lower.includes('sign up') || lower.includes('join')) && (lower.includes('business') || lower.includes('brand'))) return 'register business';
  if (lower.includes('register') || lower.includes('sign up') || lower.includes('join') || lower.includes('get started') || lower.includes('register me')) return 'register';
  if (lower.includes('what is glow up') || lower.includes('about glow up') || lower.includes('glow up?')) return 'what is glow up';
  return null;
}

function getFallback(input) {
  return `Thank you for your message. I'd be glad to assist you further. Here is a summary of the topics I can help you with:\n\n• An overview of what Glow Up is and how it works\n• Features and benefits for creators and business operators\n• The GLOW token economy and how to earn rewards\n• Subscription plans and pricing details\n• Our commission and escrow payment structure\n• Step-by-step registration assistance\n\nPlease feel free to select one of the options above, or simply type your question and I'll do my best to assist you.`;

// ── MESSAGE RENDERING ──
function addMessage(content, isUser, extras) {
  const wrap = document.getElementById('chatWrap');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + (isUser ? 'user' : '');

  const ava = document.createElement('div');
  ava.className = 'msg-ava ' + (isUser ? 'user' : 'ai');
  ava.textContent = isUser ? 'Me' : '✦';

  const right = document.createElement('div');
  right.style.maxWidth = '85%';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (isUser ? 'user' : 'ai');
  bubble.innerHTML = content.replace(/\n/g, '<br>');

  const time = document.createElement('div');
  time.className = 'ts' + (isUser ? ' right' : '');
  time.textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

  right.appendChild(bubble);
  right.appendChild(time);

  if (!isUser) {
    msgDiv.appendChild(ava);
    msgDiv.appendChild(right);
  } else {
    msgDiv.appendChild(right);
    msgDiv.appendChild(ava);
  }

  wrap.appendChild(msgDiv);

  // Extras
  if (extras) {
    if (extras.card) addChatCard(extras.card, wrap);
    if (extras.features) addFeatureList(extras.features, wrap);
    if (extras.planData) addPlanCard(wrap);
    if (extras.replies && extras.replies.length) addQuickReplies(extras.replies, wrap);
    if (extras.startReg) startRegistration(extras.startReg, wrap);
  }

  wrap.scrollTop = wrap.scrollHeight;
}

function addChatCard(card, wrap) {
  const div = document.createElement('div');
  div.style.paddingLeft = '36px';
  const inner = document.createElement('div');
  inner.className = 'chat-card';
  inner.innerHTML = `<div class="chat-card-title">${card.title}</div>` +
    card.rows.map(r => `<div class="cc-row"><span class="cc-key">${r[0]}</span><span class="cc-val">${r[1]}</span></div>`).join('');
  div.appendChild(inner);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function addFeatureList(features, wrap) {
  const div = document.createElement('div');
  div.style.paddingLeft = '36px';
  const inner = document.createElement('div');
  inner.className = 'chat-card';
  inner.innerHTML = `<div class="feature-list">${features.map(f => `<div class="feat-item"><div class="feat-dot"></div><div>${f}</div></div>`).join('')}</div>`;
  div.appendChild(inner);
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function addPlanCard(wrap) {
  const div = document.createElement('div');
  div.style.paddingLeft = '36px';
  div.innerHTML = `<div class="chat-card">

}

function addQuickReplies(replies, wrap) {
  const div = document.createElement('div');
  div.className = 'quick-replies';
  replies.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'qr-chip';
    btn.textContent = r;
    btn.onclick = () => { handleQuickReply(r); div.remove(); };
    div.appendChild(btn);
  });

  wrap.scrollTop = wrap.scrollHeight;

// ── TYPING + RESPONSE ──
function showTyping() {
  const wrap = document.getElementById('chatWrap');
  const div = document.createElement('div');
  div.className = 'msg';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="msg-ava ai">✦</div><div class="typing-wrap"><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function typeMessage(text, replies, extras) {
  showTyping();
  const delay = Math.min(800 + text.length * 3, 2200);
  setTimeout(() => {
    hideTyping();
    addMessage(text, false, { ...extras, replies });
  }, delay);
}

function nextRegStep(step, type) {
  regStep = step + 1;
  const existing = document.getElementById('regForm');
  if (existing) existing.remove();
  const wrap = document.getElementById('chatWrap');

  const confirmMsgs = {
    1: type === 'creator' ? "Thank you — your details have been noted. Let us now proceed to set up your creator profile. 👇" : "Thank you — your details have been received. Let us now configure your campaign preferences. 👇",
    2: "Excellent progress — you are almost there. Please select your preferred membership plan to complete your registration. 🎉"
  };

  addMessage(confirmMsgs[step], false, null);
  setTimeout(() => showRegStep(type, wrap), 500);
}

function completeReg(type) {
  const existing = document.getElementById('regForm');
  if (existing) existing.remove();
  conversationState = 'registered';

  const plan = type === 'creator'
    ? (document.getElementById('rf_plan') ? document.getElementById('rf_plan').value : 'starter')
    : (document.getElementById('rf_bplan') ? document.getElementById('rf_bplan').value : 'growth');

  const glowAmount = type === 'creator' ? '250' : '100';
  const emoji = type === 'creator' ? '🌱' : '🏢';

  setTimeout(() => {
    addMessage(`${emoji} <strong>You're all set!</strong> Welcome to Glow Up!\n\nYour ${type} account has been created. You've been awarded <strong>${glowAmount} GLOW tokens</strong> 🪙 as your welcome bonus.\n\nHere's what to do next:`, false, null);

      const wrap = document.getElementById('chatWrap');
      addFeatureList(
        type === 'creator'
          ? ["Complete your profile — add a photo and bio", "Connect your social accounts (+50 GLOW each)", "Browse brand offers in your dashboard", "Share your referral link — earn 200 GLOW per friend"]

      );

        type === 'creator'
          ? ["How do I connect my socials?", "Tell me about brand offers", "How do I earn more GLOW?"]
          : ["How do I post a campaign?", "How does escrow work?", "Tell me about creator matching"],

      );
    }, 600);
  }, 400);
}

function socialReg(platform) {
  const existing = document.getElementById('regForm');
  if (existing) existing.remove();
  regStep = 2;
  addMessage(`Connecting with <strong>${platform}</strong>... ✅\n\nI've pulled your basic profile. Now let's complete your creator details:`, false, null);
  setTimeout(() => showRegStep('creator', document.getElementById('chatWrap')), 600);
}

// ── USER INPUT HANDLING ──
function handleQuickReply(text) {
  addMessage(text, true, null);
  processInput(text);
}

function sendUserMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage(text, true, null);
  processInput(text);
}

function processInput(text) {
  const key = matchResponse(text);
  if (key) {
    const resp = RESPONSES[key];
    const extras = {};
    if (resp.card) extras.card = resp.card;
    if (resp.features) extras.features = resp.features;
    if (resp.planData) extras.planData = true;
    if (resp.startReg) extras.startReg = resp.startReg;

    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage(resp.text, false, { ...extras, replies: resp.replies || [] });
    }, Math.min(600 + resp.text.length * 2, 2000));
  } else {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage(getFallback(text), false, {
        replies: ["What is Glow Up?", "Register as a creator", "Register as a business", "How do I earn?", "Tell me about GLOW tokens"]
      });
    }, 1000);
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendUserMsg(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function resetChat() {
  document.getElementById('chatWrap').innerHTML = '';
  regStep = 0;
  regData = {};
  conversationState = 'greeting';
  startGreeting(true);
}
